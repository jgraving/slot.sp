name: Shortcut guide regression checks
on:
  push:
    branches: ['integrate-upstream-shortcut-reference']
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/shortcut-reference.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    env:
      SLOT_SILENT: '1'
      SLOT_FEATURE_PREVIEW: /tmp/slot-feature-previews
    steps:
      - uses: actions/checkout@v7
      - name: Install software rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libasound2t64
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Test shortcut guides and kid-mode access
        run: |
          mkdir -p "$SLOT_FEATURE_PREVIEW"
          cargo test --locked -p slot --no-default-features --lib --test app --test shortcut_reference --test settings_notices --test kid_controls --test kid_policy --test in_game_menu --test quick_menu --test quick_controls --test bindings --test play --test emu --test core_options -- --test-threads=1
          cargo test --locked -p slot-ui --test settings_notice --lib --test quick_menu --test typography --test native_menus --test kid_time
          cargo test --locked -p slot-gfx --no-default-features --lib --test grade --test layout --test lava --test scale --test blit --test power
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: shortcut-guide-review
          path: /tmp/slot-feature-previews/*.png
          if-no-files-found: error
