name: Network and achievements test build
on:
  pull_request:
    paths: ['crates/**', 'card/System/slotwifi.sh', 'card/System/slotlink.sh', 'card/System/slotsmb.sh', 'card/test-smb*', 'tools/*samba*', 'taskfile.yml', '.github/workflows/network-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: network-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  samba:
    name: Build and test encrypted network sharing
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Runtime security-update cache window
        id: week
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: samba-cache
        with:
          path: |
            vendor/samba
            vendor/samba-sources
          key: samba-4.25.1-trixie-arm64-${{ steps.week.outputs.week }}-${{ hashFiles('tools/build-samba.sh', 'tools/samba-build-env.sh', 'tools/prepare-samba-output.py') }}
      - name: Build maintained Samba and discovery with private dependencies
        if: steps.samba-cache.outputs.cache-hit != 'true'
        run: bash tools/samba-build-env.sh
      - uses: actions/cache/save@v5
        if: steps.samba-cache.outputs.cache-hit != 'true'
        with:
          path: |
            vendor/samba
            vendor/samba-sources
          key: ${{ steps.samba-cache.outputs.cache-primary-key }}
      - name: Install test interpreter for a cached runtime
        if: steps.samba-cache.outputs.cache-hit == 'true'
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Exercise real SMB authentication, encryption, uploads and shutdown
        run: |
          python3 tools/test-samba-output.py
          python3 card/test-smb-integration.py vendor/samba
      - uses: actions/upload-artifact@v7
        with:
          name: samba-runtime
          retention-days: 1
          path: |
            vendor/samba
            vendor/samba-sources
          if-no-files-found: error
  device:
    needs: samba
    if: github.repository == 'jgraving/slot.sp'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    container: rust:1-bullseye
    env:
      SLOT_SILENT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: samba-runtime
          path: vendor
      - name: Restore executable modes
        run: chmod +x vendor/samba/bin/* vendor/samba/lib/* vendor/samba/libexec/*
      - name: Install build dependencies
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake libasound2 python3
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
      - name: Check device and test credential storage and offline tracking
        run: |
          cargo check --locked -p slot --no-default-features --features device
          cargo test --locked -p slot-achievements -p slot-retro --lib
          cargo test --locked -p slot --no-default-features --lib --test studio_state --test device_studio_sharing --test sleep --test power --test quick_menu --test in_game_menu --test settings_notices --test emu --test kid_controls --test parent_code --test fork_updates --test net_time --test sntp -- --test-threads=1
          cargo test --locked -p slot-ui --lib --test quick_menu
          sh card/test-slotlink.sh
          sh card/test-update.sh
          sh card/test-launch.sh
          python3 card/test-wifi-security.py
      - name: Build test System folder
        run: task dist:device OUT=dist-network
      - name: Validate both bundled cores
        run: SLOT_REQUIRE_CORES=1 cargo test --locked -p slot-retro --test gba_achievements
      - name: Package test build
        run: |
          python3 tools/package-release.py dist-network network-assets "$GITHUB_SHA"
          mv network-assets/slot.sp-System.zip slot.sp-network-System.zip
          mv network-assets/slot.sp-network-sources.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: slot.sp-network-System
          retention-days: 1
          path: |
            slot.sp-network-System.zip
            slot.sp-network-sources.zip
          if-no-files-found: error
