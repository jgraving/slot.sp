name: Capture documentation media
on:
  push:
    branches: [docs/media-refresh, 'docs/homepage-*']
    paths: ['crates/**', 'assets/**', 'previews/*.rs', 'previews/*.py', 'previews/*.script', 'previews/artwork/**', 'tools/opaque_preview_gif.py', 'tools/collect-doc-media.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'jgraving/slot.sp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      SLOT_SILENT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1-mesa-dev libgl1-mesa-dri
          python3 -m pip install pillow==13.0.0
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build production capture tools
        run: |
          set -eu
          for name in capture egl_surface link_capture fixture lava_check insertion_hero boot_brand cart_motion docs_ui; do
            cp "previews/$name.rs" "crates/slot/examples/$name.rs"
          done
          cargo build --locked -p slot --no-default-features --example capture --example fixture --example lava_check --example insertion_hero --example boot_brand --example cart_motion --example docs_ui --example layout_review
          cargo test --locked -p slot --no-default-features --test parent_code --test button_code --test kid_controls --test sound_menu_style -- --test-threads=1
          cargo test --locked -p slot-ui --test typography --test sticker --test kid_smiley --test cart_motion --test quick_menu
      - name: Record current interface
        run: |
          set -eu
          mkdir -p /tmp/slot-docs/out
          target/debug/examples/fixture /tmp/slot-docs/card
          python3 previews/prepare_art.py /tmp/slot-docs/card
          target/debug/examples/capture /tmp/slot-docs/card previews/readme.script /tmp/slot-docs/out
          python3 previews/make_hero_art.py /tmp/slot-docs/out
          target/debug/examples/insertion_hero /tmp/slot-docs/card /tmp/slot-docs/out
          target/debug/examples/boot_brand /tmp/slot-docs/out
          target/debug/examples/cart_motion /tmp/slot-docs/card /tmp/slot-docs/out
          target/debug/examples/lava_check /tmp/slot-docs/out
          target/debug/examples/docs_ui /tmp/slot-docs/card /tmp/slot-docs/out
          target/debug/examples/layout_review /tmp/slot-docs/layout
          python3 tools/compose-layout-review.py /tmp/slot-docs/layout /tmp/slot-docs/out/menu-overview.png menu
          python3 tools/compose-layout-review.py /tmp/slot-docs/layout /tmp/slot-docs/out/sound-overview.png sound
          python3 tools/collect-doc-media.py /tmp/slot-docs
      - name: Prepare media objects for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/collect-doc-media.py /tmp/slot-docs --git-objects
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-media
          path: |
            /tmp/slot-docs/publish/**
            /tmp/slot-docs/media-entries.json
          if-no-files-found: error
