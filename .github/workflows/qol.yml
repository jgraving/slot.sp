name: Launcher quality of life checks
on:
  push:
    branches: [main]
    paths: ['crates/**', '.github/workflows/qol.yml']
  pull_request:
    paths: ['crates/**', '.github/workflows/qol.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    env:
      SLOT_SILENT: '1'
      SLOT_QOL_PREVIEW: /tmp/slot-qol-previews
    steps:
      - uses: actions/checkout@v7
      - name: Install rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libasound2t64
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Test favorites, history, and settings
        run: |
          python3 card/test-bluetooth.py
          cargo check --locked -p slot --no-default-features --features device
          cargo test --locked -p slot-input --tests
          cargo test --locked -p slot-store --lib --tests
          cargo test --locked -p slot --no-default-features --lib --test ui_accessibility --test brand_motion --test parent_code --test button_code --test headphones --test sound_menu_style --test night_display --test bindings --test play_history --test favorites --test recents --test state_writer --test sleep --test show_titles --test quick_menu --test quick_controls --test in_game_menu --test in_game_menu_session --test settings_notices --test kid_controls --test clock --test levels -- --test-threads=1
          cargo test --locked -p slot-ui --test icon --test audio_icons --test toast --test kid_smiley --test battery --test settings_notice --lib --test legend --test kid_time --test quick_menu --test expressive --test typography --test toggle --test native_menus --test shot_viewer --test shelf --test native_shelf --test hud --test clock
      - name: Render expressive menus through GLES and desktop GL
        run: |
          cargo run --locked -p slot-ui --example expressive_menu_preview -- "$SLOT_QOL_PREVIEW/expressive-gles" gles 640
          cargo run --locked -p slot-ui --example expressive_menu_preview -- "$SLOT_QOL_PREVIEW/expressive-gl" gl 720
          cargo run --locked -p slot --no-default-features --example control_preview -- "$SLOT_QOL_PREVIEW/controls-gles" gles 640
          cargo run --locked -p slot --no-default-features --example control_preview -- "$SLOT_QOL_PREVIEW/controls-gl" gl 720
          cargo run --locked -p slot --no-default-features --example settings_review -- "$SLOT_QOL_PREVIEW/settings-gles" gles 640
          cargo run --locked -p slot --no-default-features --example settings_review -- "$SLOT_QOL_PREVIEW/settings-gl" gl 720
          cargo run --locked -p slot --no-default-features --example boot_review -- "$SLOT_QOL_PREVIEW/boot-gles" gles 640
          cargo run --locked -p slot --no-default-features --example boot_review -- "$SLOT_QOL_PREVIEW/boot-gl" gl 720
          cargo run --locked -p slot --no-default-features --example accessibility_review -- "$SLOT_QOL_PREVIEW/accessibility-gles" gles 640
          cargo run --locked -p slot --no-default-features --example accessibility_review -- "$SLOT_QOL_PREVIEW/accessibility-gl" gl 720
          cargo run --locked -p slot --no-default-features --example gallery_review -- "$SLOT_QOL_PREVIEW/gallery-gles" gles 640
          cargo run --locked -p slot --no-default-features --example gallery_review -- "$SLOT_QOL_PREVIEW/gallery-gl" gl 720
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: launcher-qol-review
          path: |
            /tmp/slot-qol-previews/**/*.png
            !/tmp/slot-qol-previews/**/motion-*.png
          if-no-files-found: error
