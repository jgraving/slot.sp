name: pages

on:
  pull_request:
    paths:
      - 'site/**'
      - '*.md'
      - 'previews/**'
      - 'licenses/GoogleSansFlex-OFL.txt'
      - 'crates/slot-ui/assets/fonts/profiles.json'
      - 'tools/prepare-site.py'
      - 'tools/assemble-studio.py'
      - 'tools/check-site.py'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '*.md'
      - 'previews/**'
      - 'licenses/GoogleSansFlex-OFL.txt'
      - 'crates/slot-ui/assets/fonts/profiles.json'
      - 'tools/prepare-site.py'
      - 'tools/assemble-studio.py'
      - 'tools/check-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install website dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 3 zensical==0.0.71 'fonttools[woff]==4.61.1' pillow==13.0.0 --only-binary=av av==16.0.0
      - id: studio
        name: Read Cart Studio pin
        run: echo "ref=$(python -c 'import json; print(json.load(open("site/studio.json"))["ref"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: jgraving/slot-cart-studio
          ref: ${{ steps.studio.outputs.ref }}
          path: _studio/slot-cart-studio
      - id: renderer
        name: Read cartridge renderer pin
        run: echo "ref=$(cat _studio/slot-cart-studio/slot.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: BrandonKowalski/slot
          ref: ${{ steps.renderer.outputs.ref }}
          path: _studio/slot
      - name: Build Cart Studio WebAssembly
        run: |
          set -eu
          rustup toolchain install 1.96 --profile minimal --target wasm32-unknown-unknown
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          cd _studio/slot-cart-studio
          "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack" build --release --target web --no-typescript --out-dir web/pkg
      - name: Prepare feature guides, font and fork previews
        run: python tools/prepare-site.py
      - name: Build website
        run: zensical build --clean --strict -f site/zensical.toml
      - name: Integrate Cart Studio
        run: python tools/assemble-studio.py
      - name: Check published links and assets
        run: python tools/check-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: Publish website
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.repository == 'jgraving/slot.sp' || vars.ENABLE_PAGES == 'true')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
