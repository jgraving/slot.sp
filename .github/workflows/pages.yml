name: pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'GUIDE.md'
      - 'GETTING-STARTED.md'
      - 'CONTROLS.md'
      - 'LIBRARY.md'
      - 'PLAYING.md'
      - 'SCREENSHOTS.md'
      - 'DISPLAY.md'
      - 'NIGHT-DISPLAY.md'
      - 'BLUETOOTH.md'
      - 'KID-MODE.md'
      - 'POWER-OPTIONS.md'
      - 'LINK-PLAY.md'
      - 'CART-STUDIO.md'
      - 'SETTINGS.md'
      - 'RETROACHIEVEMENTS.md'
      - 'previews/**'
      - 'licenses/GoogleSansFlex-OFL.txt'
      - 'crates/slot-ui/assets/fonts/profiles.json'
      - 'tools/prepare-site.py'
      - 'tools/assemble-studio.py'
      - 'tools/studio-artwork.py'
      - 'tools/test-studio-artwork.py'
      - 'tools/check-site.py'
      - 'tools/check-site-navigation.cjs'
      - 'tools/check-page-motion.cjs'
      - '.github/workflows/pages.yml'
      - 'site/scripts/ci-scope.py'
      - 'site/scripts/test-ci-scope.py'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'GUIDE.md'
      - 'GETTING-STARTED.md'
      - 'CONTROLS.md'
      - 'LIBRARY.md'
      - 'PLAYING.md'
      - 'SCREENSHOTS.md'
      - 'DISPLAY.md'
      - 'NIGHT-DISPLAY.md'
      - 'BLUETOOTH.md'
      - 'KID-MODE.md'
      - 'POWER-OPTIONS.md'
      - 'LINK-PLAY.md'
      - 'CART-STUDIO.md'
      - 'SETTINGS.md'
      - 'RETROACHIEVEMENTS.md'
      - 'previews/**'
      - 'licenses/GoogleSansFlex-OFL.txt'
      - 'crates/slot-ui/assets/fonts/profiles.json'
      - 'tools/prepare-site.py'
      - 'tools/assemble-studio.py'
      - 'tools/studio-artwork.py'
      - 'tools/test-studio-artwork.py'
      - 'tools/check-site.py'
      - 'tools/check-site-navigation.cjs'
      - 'tools/check-page-motion.cjs'
      - '.github/workflows/pages.yml'
      - 'site/scripts/ci-scope.py'
      - 'site/scripts/test-ci-scope.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select website checks
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.scope.outputs.website }}
      model: ${{ steps.scope.outputs.model }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test website CI routing
        run: python3 site/scripts/test-ci-scope.py
      - id: scope
        name: Detect website and model dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_WEBSITE_CHECKS: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 site/scripts/ci-scope.py

  model:
    needs: changes
    if: needs.changes.outputs.model == 'true'
    name: Check 3D handheld preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare homepage
        run: |
          python -m pip install --disable-pip-version-check zensical==0.0.71 'fonttools[woff]==4.61.1' pillow==13.0.0
          python tools/prepare-site.py
          zensical build --clean --strict -f site/zensical.build.toml
      - name: Check the 3D model on desktop and phone
        env:
          NODE_PATH: ${{ runner.temp }}/model-browser/node_modules
          SP_MODEL_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/model-browser" playwright@1.62.1
          node site/scripts/check-sp-model.cjs "$RUNNER_TEMP/sp-model-review"
          if [ "$SP_MODEL_FULL" = true ]; then
            "$RUNNER_TEMP/model-browser/node_modules/.bin/playwright" install --with-deps webkit
            node site/scripts/check-sp-video.cjs "$RUNNER_TEMP/sp-model-review/video"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sp-model-review
          retention-days: 3
          path: ${{ runner.temp }}/sp-model-review
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: Build and check website
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install website dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 3 zensical==0.0.71 'fonttools[woff]==4.61.1' pillow==13.0.0 --only-binary=av av==16.0.0
      - id: studio
        name: Read Cart Studio pin
        run: echo "ref=$(python -c 'import json; print(json.load(open("site/studio.json"))["ref"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: jgraving/slot-cart-studio
          ref: ${{ steps.studio.outputs.ref }}
          path: _studio/slot-cart-studio
      - id: renderer
        name: Read cartridge renderer pin
        run: |
          echo "ref=$(cat _studio/slot-cart-studio/slot.ref)" >> "$GITHUB_OUTPUT"
          echo "repository=$(cat _studio/slot-cart-studio/slot.repo)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.renderer.outputs.repository }}
          ref: ${{ steps.renderer.outputs.ref }}
          path: _studio/slot
      - name: Build Cart Studio WebAssembly
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          rustup toolchain install 1.96 --profile minimal --target wasm32-unknown-unknown
          sh tools/install-wasm-pack.sh "$RUNNER_TEMP"
          cd _studio/slot-cart-studio
          "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack" build --release --target web --no-typescript --out-dir web/pkg
      - name: Prepare feature guides, font and fork previews
        run: python tools/prepare-site.py
      - name: Build website
        run: zensical build --clean --strict -f site/zensical.build.toml
      - name: Integrate Cart Studio
        run: python tools/assemble-studio.py
      - name: Publish local artwork state
        run: |
          python3 tools/test-studio-artwork.py
          python3 tools/studio-artwork.py
      - name: Check published links and assets
        run: python tools/check-site.py
      - name: Check navigation on desktop and phones
        env:
          NODE_PATH: ${{ runner.temp }}/website-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/website-browser" playwright@1.62.1
          node tools/check-site-navigation.cjs "$RUNNER_TEMP/website-navigation-review"
          node tools/check-page-motion.cjs "$RUNNER_TEMP/website-navigation-review/page-motion"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-navigation-review
          retention-days: 1
          path: ${{ runner.temp }}/website-navigation-review
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          retention-days: 1
          path: site/public

  deploy:
    name: Publish website
    needs: [changes, build, model]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (github.repository == 'jgraving/slot.sp' || vars.ENABLE_PAGES == 'true')
      && needs.build.result == 'success'
      && (needs.model.result == 'success' || (needs.changes.outputs.model == 'false' && needs.model.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Remove the deployed Pages upload
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: context.runId, per_page: 100});
            for (const artifact of artifacts.filter(a => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
