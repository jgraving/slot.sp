name: Capture cartridge motion
on:
  push:
    branches: [integrate-upstream-kid-time-warnings, integrate-upstream-parent-controls, integrate-upstream-google-sans-flex]
    paths: ['crates/**', 'assets/**', 'previews/cart_motion.rs', '.github/workflows/cart-motion-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      SLOT_SILENT: '1'
      SLOT_KID_UI_PREVIEW: /tmp/slot-native/previews
      SLOT_STICKER_PREVIEW: /tmp/slot-native/previews/about-sticker.png
      SLOT_SOUND_PREVIEW: /tmp/slot-native/previews/sound.png
    steps:
      - uses: actions/checkout@v7
      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1-mesa-dev libgl1-mesa-dri python3-pil
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build production capture
        run: |
          cp previews/cart_motion.rs crates/slot/examples/cart_motion.rs
          cp previews/egl_surface.rs crates/slot/examples/egl_surface.rs
          cp previews/fixture.rs crates/slot/examples/motion_fixture.rs
          cargo build --locked -p slot --no-default-features --example cart_motion --example motion_fixture
      - name: Check cartridge interaction and sound
        run: |
          mkdir -p /tmp/slot-native/previews
          cargo test --locked -p slot --no-default-features --lib --test app --test eject --test sfx --test kid_controls --test parent_code --test button_code --test quick_menu --test in_game_menu --test sound_menu_style -- --test-threads=1
      - name: Check switches and menu graphics
        run: cargo test --locked -p slot-ui --test typography --test toggle --test quick_menu --test sticker --test legend --test toast --test cart --test board --test hud
      - name: Capture typography in production menu layouts
        run: |
          cargo run --locked -p slot --no-default-features --example layout_review -- /tmp/slot-native/layout
          python3 tools/compose-layout-review.py /tmp/slot-native/layout /tmp/slot-native/previews/menus.png menu
          python3 tools/compose-layout-review.py /tmp/slot-native/layout /tmp/slot-native/previews/sound-layout.png sound
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          retention-days: 1
          name: typography-previews
          path: /tmp/slot-native/previews/*.png
          if-no-files-found: warn
      - name: Record motion and contact sounds
        run: |
          mkdir -p /tmp/slot-motion/out
          target/debug/examples/motion_fixture /tmp/slot-motion/card
          python3 previews/prepare_art.py /tmp/slot-motion/card
          target/debug/examples/cart_motion /tmp/slot-motion/card /tmp/slot-motion/out
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: cartridge-motion-preview
          path: /tmp/slot-motion/out/*
          if-no-files-found: error
