name: Capture homepage previews
on:
  push:
    branches: ['docs/homepage-*', 'docs/media-refresh']
    paths: ['previews/**', 'crates/slot-ui/**', '.github/workflows/homepage-previews.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'jgraving/slot.sp'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      SLOT_SILENT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install capture dependencies
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg || ! ldconfig -p | grep 'libEGL.so.1' >/dev/null || ! dpkg-query -W -f='${Status}' libgl1-mesa-dri | grep 'install ok installed' >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg libegl1-mesa-dev libgl1-mesa-dri
          fi
          python3 -m pip install pillow==13.0.0
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build current production animation
        run: |
          set -eu
          for name in egl_surface fixture capture link_capture insertion_hero; do
            cp "previews/$name.rs" "crates/slot/examples/$name.rs"
          done
          cargo build --locked -p slot --no-default-features --example fixture --example capture --example insertion_hero
          mkdir -p /tmp/slot-homepage/stickers
          SLOT_KID_UI_PREVIEW=/tmp/slot-homepage/stickers cargo test --locked -p slot-ui --test cart_motion --test favorite --test kid_smiley
          cargo test --locked -p slot --no-default-features --test kid_controls
      - name: Render four matching finishes
        run: |
          set -eu
          mkdir -p /tmp/slot-homepage/out /tmp/slot-homepage/publish/previews/homepage
          python3 previews/make_hero_art.py /tmp/slot-homepage/out
          for finish in graphite platinum pearl_blue pearl_pink; do
            target/debug/examples/fixture "/tmp/slot-homepage/card-$finish" "$finish"
            python3 previews/prepare_art.py "/tmp/slot-homepage/card-$finish"
            mkdir -p "/tmp/slot-homepage/out/$finish"
            target/debug/examples/capture "/tmp/slot-homepage/card-$finish" previews/homepage.script "/tmp/slot-homepage/out/$finish"
            target/debug/examples/insertion_hero "/tmp/slot-homepage/card-$finish" /tmp/slot-homepage/out "$finish"
          done
          python3 previews/compose_homepage.py /tmp/slot-homepage
          mkdir -p /tmp/slot-homepage/gif
          ffmpeg -nostdin -v error -y -i /tmp/slot-homepage/out/platinum/hero.mp4 -vf fps=12.5 /tmp/slot-homepage/gif/%04d.png
          python3 tools/opaque_preview_gif.py /tmp/slot-homepage/gif /tmp/slot-homepage/out/readme-hero.gif --width 440 --frame-ms 80
          python3 previews/collect_homepage.py /tmp/slot-homepage
      - name: Prepare media blobs for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/collect-doc-media.py /tmp/slot-homepage --git-objects
      - uses: actions/upload-artifact@v7
        with:
          name: homepage-media
          path: |
            /tmp/slot-homepage/publish/**
            /tmp/slot-homepage/media-entries.json
            /tmp/slot-homepage/stickers/*.png
          if-no-files-found: error
