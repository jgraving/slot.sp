name: Capture original demo media
on:
  push:
    branches: [refresh/demo-media, refresh/device-shell-logos]
    paths: ['previews/*.rs', 'previews/*.py', 'previews/artwork/**', 'assets/**', 'crates/slot-ui/src/cart.rs', '.github/workflows/demo-media.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: demo-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      SLOT_SILENT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the completed native capture
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
            const {owner,repo}=context.repo;
            const artifact=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:13575119875,archive_format:'zip'});
            const bytes=Buffer.from(artifact.data);
            if(crypto.createHash('sha256').update(bytes).digest('hex')!=='3e5fa3fbc465a5970f260d32676034a5c7b2ce2522949143f36695fc4b55b880') throw new Error('Capture archive differs');
            const zip=path.join(process.env.RUNNER_TEMP,'completed-capture.zip');fs.writeFileSync(zip,bytes);
            const out=path.join(process.env.RUNNER_TEMP,'demo-media/publish');fs.mkdirSync(out,{recursive:true});
            require('node:child_process').execFileSync('python3',['-c',`
            import sys,zipfile
            from pathlib import Path
            with zipfile.ZipFile(sys.argv[1]) as z:
                for name in z.namelist():
                    p=Path(name)
                    assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='previews',name
                z.extractall(sys.argv[2])
            `,zip,out],{stdio:'inherit'});
            for(const file of ['current','homepage','interactive','readme-model','sp-model']) {
              const manifest=JSON.parse(fs.readFileSync(path.join(out,'previews',file,'provenance.json'),'utf8'));
              if(manifest.source_commit!=='77358c762610980c0818b25c54d5cb0b4ca88f75') throw new Error('Unexpected capture source');
              for(const entry of manifest.files) {
                const file=path.resolve(out,entry.path);
                if(!file.startsWith(out+path.sep)) throw new Error('Unexpected media path');
                if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==entry.sha256) throw new Error('Media hash differs');
              }
            }
      - name: Check and save generated media to the source branch
        uses: actions/github-script@v8
        env:
          MEDIA_ROOT: ${{ runner.temp }}/demo-media/publish
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            if (branch !== 'refresh/device-shell-logos') throw new Error('Capture only updates refresh/device-shell-logos');
            const {data: head} = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (head.object.sha !== context.sha) throw new Error('Source advanced; rerun capture on the new source');
            const {data: parent} = await github.rest.git.getCommit({owner, repo, commit_sha: context.sha});
            const entries = [];
            async function collect(directory) {
              for (const item of fs.readdirSync(directory, {withFileTypes:true})) {
                const file = path.join(directory, item.name);
                if (item.isDirectory()) { await collect(file); continue; }
                const relative = path.relative(process.env.MEDIA_ROOT, file);
                if (!relative.startsWith('previews/')) throw new Error(`Unexpected output ${relative}`);
                const {data: blob} = await github.rest.git.createBlob({owner, repo, content:fs.readFileSync(file).toString('base64'), encoding:'base64'});
                entries.push({path:relative, mode:'100644', type:'blob', sha:blob.sha});
              }
            }
            await collect(process.env.MEDIA_ROOT);
            if (entries.length < 100) throw new Error('Capture output is incomplete');
            const {data: tree} = await github.rest.git.createTree({owner, repo, base_tree:parent.tree.sha, tree:entries});
            const {data: commit} = await github.rest.git.createCommit({owner, repo, tree:tree.sha, parents:[context.sha], message:'Refresh native demo media'});
            await github.rest.git.updateRef({owner, repo, ref:`heads/${branch}`, sha:commit.sha, force:false});
            await core.summary.addRaw(`Saved ${entries.length} generated files in ${commit.sha}.\n`).write();
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-demo-media
          retention-days: 1
          path: ${{ runner.temp }}/demo-media/publish
          if-no-files-found: ignore
