name: Capture original demo media
on:
  push:
    branches: [refresh/demo-media]
    paths: ['previews/*.rs', 'previews/*.py', 'previews/artwork/**', 'assets/**', 'crates/slot-ui/src/cart.rs', '.github/workflows/demo-media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: demo-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      SLOT_SILENT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1-mesa-dri
          python3 -m pip install pillow==13.0.0 av==16.0.0 numpy
          npm install --prefix "$RUNNER_TEMP/model-browser" playwright@1.62.1
      - name: Capture current guides and native hero
        run: |
          python3 previews/prepare_site_capture.py
          cargo build --locked -p slot --no-default-features --example site_refresh
          target/debug/examples/site_refresh "$RUNNER_TEMP/demo-media" all
          target/debug/examples/site_refresh "$RUNNER_TEMP/demo-media" audio
          UI_RELEASE_REV="$GITHUB_SHA" python3 previews/collect_site_refresh.py "$RUNNER_TEMP/demo-media"
      - name: Capture interactive homepage actions
        run: |
          python3 previews/prepare_interactive_capture.py
          cargo run --locked -p slot --no-default-features --example interactive_hero -- "$RUNNER_TEMP/demo-interactive/raw"
          python3 previews/collect_interactive_hero.py "$RUNNER_TEMP/demo-interactive"
          cp -R "$RUNNER_TEMP/demo-interactive/publish/previews/interactive" "$RUNNER_TEMP/demo-media/publish/previews/"
      - name: Capture README model
        env:
          NODE_PATH: ${{ runner.temp }}/model-browser/node_modules
        run: |
          node tools/capture-readme-model.cjs "$RUNNER_TEMP/demo-media" "$RUNNER_TEMP/demo-media/publish/previews/homepage/hero-light-platinum.mp4"
          mkdir -p "$RUNNER_TEMP/demo-media/publish/previews/readme-model"
          python3 tools/opaque_preview_gif.py "$RUNNER_TEMP/demo-media/model-frames" "$RUNNER_TEMP/demo-media/publish/previews/readme-model/hero.gif" --width 820 --frame-ms 80
          python3 previews/collect_readme_model.py "$RUNNER_TEMP/demo-media"
      - name: Check and save generated media to the source branch
        uses: actions/github-script@v8
        env:
          MEDIA_ROOT: ${{ runner.temp }}/demo-media/publish
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path');
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            if (branch !== 'refresh/demo-media') throw new Error('Capture only updates refresh/demo-media');
            const {data: head} = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (head.object.sha !== context.sha) throw new Error('Source advanced; rerun capture on the new source');
            const {data: parent} = await github.rest.git.getCommit({owner, repo, commit_sha: context.sha});
            const entries = [];
            async function collect(directory) {
              for (const item of fs.readdirSync(directory, {withFileTypes:true})) {
                const file = path.join(directory, item.name);
                if (item.isDirectory()) { await collect(file); continue; }
                const relative = path.relative(process.env.MEDIA_ROOT, file);
                if (!relative.startsWith('previews/')) throw new Error(`Unexpected output ${relative}`);
                const {data: blob} = await github.rest.git.createBlob({owner, repo, content:fs.readFileSync(file).toString('base64'), encoding:'base64'});
                entries.push({path:relative, mode:'100644', type:'blob', sha:blob.sha});
              }
            }
            await collect(process.env.MEDIA_ROOT);
            if (entries.length < 100) throw new Error('Capture output is incomplete');
            const {data: tree} = await github.rest.git.createTree({owner, repo, base_tree:parent.tree.sha, tree:entries});
            const {data: commit} = await github.rest.git.createCommit({owner, repo, tree:tree.sha, parents:[context.sha], message:'Refresh native demo media'});
            await github.rest.git.updateRef({owner, repo, ref:`heads/${branch}`, sha:commit.sha, force:false});
            await core.summary.addRaw(`Saved ${entries.length} generated files in ${commit.sha}.\n`).write();
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-demo-media
          retention-days: 1
          path: ${{ runner.temp }}/demo-media/publish
          if-no-files-found: ignore
