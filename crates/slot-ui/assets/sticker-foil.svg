<defs xmlns="http://www.w3.org/2000/svg">
    <!-- Broad champagne reflections and bronze folds read as glossy foil at 33px. -->
    <linearGradient id="gold" x1="0" y1="0" x2=".55" y2="1">
      <stop stop-color="#a26b28"/>
      <stop offset=".20" stop-color="#e5b94f"/>
      <stop offset=".34" stop-color="#fff0bd"/>
      <stop offset=".43" stop-color="#f6dc8b"/>
      <stop offset=".52" stop-color="#ad7727"/>
      <stop offset=".60" stop-color="#85511e"/>
      <stop offset=".76" stop-color="#d6a33a"/>
      <stop offset=".88" stop-color="#f4d783"/>
      <stop offset="1" stop-color="#a77527"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#fff0b6"/><stop offset=".5" stop-color="#cf9d3a"/>
      <stop offset="1" stop-color="#80501e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4efdf"/><stop offset="1" stop-color="#ded5c2"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="grain"><feTurbulence baseFrequency=".7 .35" numOctaves="2" seed="17" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in2="SourceGraphic" mode="soft-light"/></filter>
</defs>
