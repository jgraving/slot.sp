<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<title>SP side close-up in satin shell material</title>
<defs>
 <linearGradient id="paint" x2="0" y2="1">
  <stop stop-color="#8d3025"/><stop offset=".08" stop-color="#bb432f"/>
  <stop offset=".19" stop-color="#c34a32"/><stop offset=".31" stop-color="#b23c29"/>
  <stop offset=".55" stop-color="#ae3828"/><stop offset=".84" stop-color="#aa3627"/>
  <stop offset=".96" stop-color="#a03225"/><stop offset="1" stop-color="#852a21"/>
 </linearGradient>
 <linearGradient id="well" x2="0" y2="1"><stop stop-color="#101216"/><stop offset="1" stop-color="#282c32"/></linearGradient>
 <path id="off" d="M467 247h5v12h-5z M477 259v-12h6 M477 253h5 M487 259v-12h6 M487 253h5"/>
 <path id="on" d="M517 247h5v12h-5z M527 259v-12l7 12v-12"/>
 <g id="marks"><use href="#off"/><use href="#on"/></g>
</defs>
<!-- The ends continue beyond the camera crop: this is the side of a handheld. -->
<rect x="-120" y="118" width="1240" height="190" rx="30" fill="url(#paint)"/>
<!-- A faint lid/body joint, without a framed panel around the switch. -->
<path d="M-120 173H1120" stroke="#73261e" stroke-opacity=".28" stroke-width="1.5"/>
<path d="M-120 175H1120" stroke="#bf462e" stroke-opacity=".23" stroke-width="1"/>
<rect x="429" y="186" width="144" height="45" rx="7" fill="#862b21"/>
<rect x="431" y="188" width="140" height="41" rx="5" fill="url(#well)"/>
<path d="M435 230H567" stroke="#c84f34" stroke-opacity=".22" fill="none"/>
<g fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
 <use href="#marks" transform="translate(0 .6)" stroke="#76271f" opacity=".7"/>
 <use href="#marks" transform="translate(0 -.5)" stroke="#c84c32" opacity=".55"/>
 <use href="#marks" stroke="#a63526"/>
</g>
</svg>
