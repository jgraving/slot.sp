<svg xmlns="http://www.w3.org/2000/svg" width="720" height="72" viewBox="0 0 720 72">
<defs>
 <linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64"><stop stop-color="#b50000"/><stop offset="1" stop-color="#ae0000"/></linearGradient>
 <linearGradient id="bevel" x2="0" y2="1"><stop stop-color="#860000"/><stop offset=".5" stop-color="#ca0000"/><stop offset="1" stop-color="#ce0000"/></linearGradient>



<!-- One continuous shoulder field in both layers. It fades to the deck in
     both axes, and is clipped to the actual material boundary, never the liner. -->
<!-- Rolled perimeter lighting is directional, not a spherical highlight. -->
<linearGradient id="shoulderRound" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="190" y2="0">
 <stop stop-color="#8b0000"/><stop offset=".18" stop-color="#a50000"/>
 <stop offset=".55" stop-color="#bb0000"/><stop offset="1" stop-color="#b50000"/>
</linearGradient>
<linearGradient id="innerRoll" gradientUnits="userSpaceOnUse" x1="191" y1="0" x2="218" y2="0">
 <stop stop-color="#b50000"/><stop offset=".2" stop-color="#c60000"/>
 <stop offset=".5" stop-color="#a20000"/><stop offset=".78" stop-color="#690000"/><stop offset="1" stop-color="#4b0000"/>
</linearGradient>
<linearGradient id="shoulderFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="68"><stop offset=".28" stop-color="white"/><stop offset=".72" stop-color="#606060"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderBlend"><rect x="160" y="0" width="400" height="72" fill="url(#shoulderFade)"/></mask>
<linearGradient id="shoulderJoin" gradientUnits="userSpaceOnUse" x1="178" y1="0" x2="215" y2="0"><stop stop-color="white"/><stop offset=".3" stop-color="#e0e0e0"/><stop offset=".65" stop-color="#707070"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderSideBlend"><rect x="160" y="0" width="60" height="72" fill="url(#shoulderJoin)"/><rect x="160" y="0" width="60" height="72" fill="url(#shoulderJoin)" transform="translate(720 0) scale(-1 1)"/></mask>
<clipPath id="plasticSurface"><path d="M160 72V25Q160 1 184 1H191C201 1 206 9 206 20C206 26 211 28.1 219 28.1C252 28.1 286 47 360 47C434 47 468 28.1 501 28.1C509 28.1 514 26 514 20C514 9 519 1 529 1H536Q560 1 560 25V72Z" fill="url(#paint)"/></clipPath>
</defs>
<!-- Rounded outer shoulders rise above the straight mouth plane. -->
<path d="M160 72V25Q160 1 184 1H191C201 1 206 9 206 20C206 26 211 28.1 219 28.1C252 28.1 286 47 360 47C434 47 468 28.1 501 28.1C509 28.1 514 26 514 20C514 9 519 1 529 1H536Q560 1 560 25V72Z" fill="url(#paint)"/>


<g clip-path="url(#plasticSurface)">
<!-- Continuous shallow scoop, matching the reference rather than a long flat centre. -->
<path d="M206 28.1H219C252 28.1 286 47 360 47C434 47 468 28.1 501 28.1H514V31.25H501C468 31.25 434 50.15 360 50.15C286 50.15 252 31.25 219 31.25H206Z" fill="url(#bevel)"/>
<path d="M206 28.1H219C252 28.1 286 47 360 47C434 47 468 28.1 501 28.1H514" fill="none" stroke="#6c0000" stroke-width=".7"/>
<path d="M206 31.25H219C252 31.25 286 50.15 360 50.15C434 50.15 468 31.25 501 31.25H514" fill="none" stroke="#c40000" stroke-width=".75"/>
</g>
<g clip-path="url(#plasticSurface)"><g mask="url(#shoulderSideBlend)"><g mask="url(#shoulderBlend)">
<rect x="160" y="0" width="60" height="72" fill="url(#shoulderRound)"/>
<rect x="160" y="0" width="60" height="72" fill="url(#shoulderRound)" transform="translate(720 0) scale(-1 1)"/>
</g></g></g>
<!-- Coaxial recessed seats: a shallow lower wall puts the head slightly
     behind the opening, with every head and driver sharing the same axis. -->
<defs>
 <linearGradient id="wellWall" x2="0" y2="1"><stop stop-color="#20262a"/><stop offset="1" stop-color="#596168"/></linearGradient>
 <linearGradient id="screw" x2=".45" y2="1"><stop stop-color="#b4bbbe"/><stop offset=".45" stop-color="#929ca1"/><stop offset="1" stop-color="#727e84"/></linearGradient>
 <g id="cornerScrew">
  <circle r="13.8" fill="#840000"/>
  <path d="M-13.3 0a13.3 13.3 0 0 0 26.6 0" fill="none" stroke="#cc0000" stroke-width=".8"/>
  <circle r="11.6" fill="url(#wellWall)"/>
  <ellipse cy="1" rx="10.4" ry="10" fill="#242b30"/>
  <g transform="translate(0 1)">
   <circle r="6.8" fill="#4b555c"/>
   <circle r="6.2" fill="url(#screw)"/>
   <path d="M-3.6 0H3.6M0-3.6V3.6" fill="none" stroke="#c2c9cc" stroke-width="1.85" transform="translate(.15 .25)"/>
   <path d="M-3.6 0H3.6M0-3.6V3.6" fill="none" stroke="#354047" stroke-width="1.45"/>
  </g>
 </g>
</defs>
<use href="#cornerScrew" transform="translate(188 42) scale(.7536231884)"/>
<use href="#cornerScrew" transform="translate(532 42) scale(.7536231884)"/>
</svg>
