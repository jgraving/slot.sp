<svg xmlns="http://www.w3.org/2000/svg" width="720" height="72" viewBox="0 0 720 72">
<defs>
<clipPath id="ribPaint"><rect x="230" y="-5" width="260" height="30"/></clipPath>
<linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64"><stop stop-color="#b50000"/><stop offset="1" stop-color="#ae0000"/></linearGradient>
<linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#c8ccca"/><stop offset=".4" stop-color="#a7aeac"/><stop offset="1" stop-color="#707976"/></linearGradient>
<linearGradient id="throat" gradientUnits="userSpaceOnUse" x1="0" y1="25" x2="0" y2="44"><stop stop-color="#292e31"/><stop offset=".08" stop-color="#858d91"/><stop offset=".24" stop-color="#aeb5b8"/><stop offset=".65" stop-color="#a2aaae"/><stop offset=".88" stop-color="#b5bdc0"/><stop offset="1" stop-color="#909a9f"/></linearGradient>

<!-- One continuous shoulder field in both layers. It fades to the deck in
     both axes, and is clipped to the actual material boundary, never the liner. -->
<!-- Rolled perimeter lighting is directional, not a spherical highlight. -->
<linearGradient id="shoulderRound" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="190" y2="0">
 <stop stop-color="#8b0000"/><stop offset=".18" stop-color="#a50000"/>
 <stop offset=".55" stop-color="#bb0000"/><stop offset="1" stop-color="#b50000"/>
</linearGradient>
<linearGradient id="innerRoll" gradientUnits="userSpaceOnUse" x1="191" y1="0" x2="218" y2="0">
 <stop stop-color="#b50000"/><stop offset=".2" stop-color="#c60000"/>
 <stop offset=".5" stop-color="#a20000"/><stop offset=".78" stop-color="#690000"/><stop offset="1" stop-color="#4b0000"/>
</linearGradient>
<linearGradient id="shoulderFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="68"><stop offset=".28" stop-color="white"/><stop offset=".72" stop-color="#606060"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderBlend"><rect x="160" y="0" width="400" height="72" fill="url(#shoulderFade)"/></mask>
<linearGradient id="shoulderJoin" gradientUnits="userSpaceOnUse" x1="178" y1="0" x2="215" y2="0"><stop stop-color="white"/><stop offset=".3" stop-color="#e0e0e0"/><stop offset=".65" stop-color="#707070"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderSideBlend"><rect x="160" y="0" width="60" height="72" fill="url(#shoulderJoin)"/><rect x="160" y="0" width="60" height="72" fill="url(#shoulderJoin)" transform="translate(720 0) scale(-1 1)"/></mask>
<clipPath id="plasticSurface"><path clip-rule="evenodd" d="M160 72V25Q160 1 184 1H536Q560 1 560 25V72Z M206 31.25H514V72H206Z"/></clipPath>
</defs>
<!-- Rear deck and inset throat. Detail proportions measured from the supplied SP close-up. -->
<!-- Rounded SP body: open-ended at the screen bottom, not an infinite deck. -->
<path d="M160 72V25Q160 1 184 1H536Q560 1 560 25V72Z" fill="url(#paint)"/>
<path d="M161 72V25Q161 2 184 2H536Q559 2 559 25V72" fill="none" stroke="#d00000" stroke-width="1.2"/>
<g transform="translate(-76.5354330709 5) scale(1.2125984252 1.05)">
<path d="M233 25H487V58H233Z" fill="url(#throat)"/>
<path d="M233 25H487" stroke="#343b3e" stroke-width=".6"/>
<!-- Set-back metal liner: rear edge and faint vertical tooling, behind the cart. -->
<path d="M238 25H482" stroke="#3b4145" stroke-width=".9"/>
<path d="M240 26H480" stroke="#c1c7c9" stroke-width=".5" opacity=".45"/>
<path d="M252 28v12m9 -12v12m14 -12v12m10 -12v12m14 -12v12m9 -12v12m15 -12v12m8 -12v12m13 -12v12m11 -12v12m12 -12v12m10 -12v12m14 -12v12m10 -12v12m13 -12v12m9 -12v12m14 -12v12m9 -12v12m12 -12v12m9 -12v12" stroke="#6f787e" stroke-width=".3" opacity=".14"/>
<path d="M257 28v9m31 -9v12m17 -11v8m32 -9v13m28 -12v10m31 -11v12m23 -12v8m29 -8v11" stroke="#edf0f0" stroke-width=".25" opacity=".16"/>
</g>
<!-- Narrow moulded reinforcing ribs sit on the rear wall, above the liner. -->
<g fill="none" stroke-linejoin="round">
 <path d="M281 30V10a4 4 0 0 1 8 0v20M431 30V10a4 4 0 0 1 8 0v20" stroke="#860000" stroke-width="1.1"/>
 <path d="M282 30V10.2a3 3 0 0 1 6 0V30M432 30V10.2a3 3 0 0 1 6 0V30" stroke="#c20000" stroke-width=".65"/>
</g>
<!-- Smaller circular rear fastener, centered in the upper wall. -->
<g transform="translate(360 16.125)">
 <circle r="7.8" fill="#780000"/>
 <path d="M-7.6 0a7.6 7.6 0 0 0 15.2 0" fill="none" stroke="#c40000" stroke-width=".6"/>
 <circle r="6.7" fill="#3d4342"/>
 <circle r="6.1" fill="url(#metal)"/>
 <path d="M0 0h3.1M0 0l-1.55 -2.684679M0 0l-1.55 2.684679" fill="none" stroke="#d4d8d4" stroke-width="1.9" transform="translate(.14 .20)"/>
 <path d="M0 0h3.1M0 0l-1.55 -2.684679M0 0l-1.55 2.684679" fill="none" stroke="#414d47" stroke-width="1.35"/>
</g>
<g transform="translate(-76.5354330709 5) scale(1.2125984252 1.05)">
<!-- Sparse shallow hairlines, not a repeating scratched overlay. -->
<g fill="none" stroke-width=".3" opacity=".55">
<path d="m303 3 .2 8m23 -7 -.1 6m65 -5 .3 9m16 -10 -.1 7m49 -6 .2 7" stroke="#ca0000"/>
<path d="m303.5 3 .2 8m23 -7 -.1 6m65 -5 .3 9m16 -10 -.1 7m49 -6 .2 7" stroke="#930000"/>
</g>
<!-- The world-space rolled shoulders below also form the inner end returns. -->
</g>
<g clip-path="url(#plasticSurface)"><g mask="url(#shoulderSideBlend)"><g mask="url(#shoulderBlend)">
<rect x="160" y="0" width="60" height="72" fill="url(#shoulderRound)"/>
<rect x="160" y="0" width="60" height="72" fill="url(#shoulderRound)" transform="translate(720 0) scale(-1 1)"/>
</g></g></g>
<!-- Deep, directional inner slopes fall from the case shoulders to the
     mouth. They belong behind the cartridge grip, not on the flat front deck. -->
<g clip-path="url(#plasticSurface)">
<path d="M191 1C207 1 215 15 215 24C215 28 223 31.25 230 31.25H220.57C211 28.1 206 26 206 20C206 9 201 1 191 1Z" fill="url(#innerRoll)"/>
<path d="M191 1C207 1 215 15 215 24C215 28 223 31.25 230 31.25H220.57C211 28.1 206 26 206 20C206 9 201 1 191 1Z" fill="url(#innerRoll)" transform="translate(720 0) scale(-1 1)"/>
</g>
</svg>
