[project]
site_url = "https://jgraving.github.io/slot.sp/"
site_name = "slot.sp"
site_description = "Game Boy games. SP style. A game launcher by Jake Graving, with four SP colors, kid mode, Bluetooth audio and more."
repo_url = "https://github.com/jgraving/slot.sp"
repo_name = "jgraving/slot.sp"
docs_dir = "docs"
site_dir = "public"

nav = [
  { "Home" = "index.md" },
  { "Get started" = ["installing.md", "updating.md"] },
  { "Features" = [
    { "Appearance & screen" = "features/display.md" },
    { "Kid mode" = "features/kid-mode.md" },
    { "Audio & headphones" = "features/bluetooth.md" },
    { "Day & night" = "features/night-display.md" },
    { "Games & artwork" = "features/library.md" },
    { "Buttons & shortcuts" = "features/controls.md" },
    { "Playing & saving" = "features/playing.md" },
    { "Screenshots" = "features/screenshots.md" },
    { "Sleep & power" = "features/power-options.md" },
    { "Link play" = "features/link-play.md" },
  ] },
  { "Guide" = [
    { "All guides" = "features/guide.md" },
    { "Installation & updates" = "features/getting-started.md" },
    { "Interactive tour" = "tour.md" },
    { "Playing" = [
      "guide/shelf.md",
      "guide/playing.md",
      "guide/screenshots.md",
      "guide/save-states.md",
      "guide/fast-forward-rewind-turbo.md",
      "guide/linking.md",
      "guide/power.md",
    ] },
    { "Making It Yours" = [
      "guide/screen.md",
      "guide/controls.md",
      "guide/customizing.md",
    ] },
    { "Reference and Help" = [
      "guide/settings.md",
      "guide/storage.md",
      "guide/troubleshooting.md",
    ] },
  ] },
  { "About" = ["questions.md", "credits.md", "ai.md"] },
]

extra_css = ["assets/slot.css", "assets/fork.css"]
extra_javascript = ["assets/slot.js"]

[project.theme]
custom_dir = "overrides"
favicon = "favicon.svg"
language = "en"
font = false
features = [
  "content.tabs.link",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
