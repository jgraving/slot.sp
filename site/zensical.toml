[project]
site_url = "https://jakegraving.com/slot.sp/"
site_name = "slot.sp"
site_description = "Your games. SP style. A game launcher by Jake Graving for Anbernic handhelds, with four SP colors, kid mode and Bluetooth audio."
repo_url = "https://github.com/jgraving/slot.sp"
repo_name = "jgraving/slot.sp"
docs_dir = "docs"
site_dir = "public"

nav = [
  { "Home" = "index.md" },
  { "Install" = ["installing.md", "updating.md"] },
  { "Guide" = [
    { "All guides" = "features/guide.md" },
    { "Buttons & shortcuts" = "features/controls.md" },
    { "Games & artwork" = "features/library.md" },
    { "Playing & saving" = "features/playing.md" },
    { "Kid mode" = "features/kid-mode.md" },
    { "Audio & headphones" = "features/bluetooth.md" },
    { "Appearance & screen" = "features/display.md" },
    { "Day & night" = "features/night-display.md" },
    { "Screenshots" = "features/screenshots.md" },
    { "Sleep & power" = "features/power-options.md" },
    { "Link play" = "features/link-play.md" },
    { "Cart Studio guide" = "features/cart-studio.md" },
    { "Reference" = ["guide/settings.md", "guide/storage.md", "guide/customizing.md", "guide/troubleshooting.md"] },
  ] },
  { "Cart Studio" = "https://jakegraving.com/slot.sp/studio/" },
  { "About" = ["questions.md", "credits.md", "ai.md"] },
]

extra_css = ["assets/device.css", "assets/slot.css"]
extra_javascript = ["assets/slot.js"]

[project.extra]
homepage_media_revision = "prepared"

[project.theme]
custom_dir = "overrides"
favicon = "favicon.svg"
language = "en"
font = false
features = [
  "content.tabs.link",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
